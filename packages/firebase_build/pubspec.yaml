name: tekartik_firebase_build
description: Firebase build and deploy helpers
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  cv: ">=1.1.0+4"
  path: ">=1.9.1"
  process_run: ">=1.2.1+1"
  dev_build: ">=1.1.7+3"
  tekartik_flutter_build:
    git:
      url: https://github.com/tekartik/app_build.dart
      path: packages/flutter_build
  tekartik_common_build:
    git:
      url: https://github.com/tekartik/app_build.dart
      path: packages/common_build
  tekartik_deploy:
    git:
      url: https://github.com/tekartik/deploy.dart
    version: '>=0.6.2'
  tekartik_android_utils:
    git:
      url: https://github.com/tekartik/android_utils.dart
    version: '>=0.6.1'
  tekartik_web_publish:
    git:
      url: https://github.com/tekartik/app_build.dart
      path: packages/web_publish
  tekartik_common_utils:
    git:
      url: https://github.com/tekartik/common_utils.dart
  # Holds the firebase project deploy/serve commands and their dev menu.
  # Not tekartik_firebase_tools: nothing here needs the admin sdk, and this
  # package is depended on by flutter apps that only want the deploy commands.
  tekartik_firebase_tools_common:
    git:
      url: https://github.com/tekartik/firebase_tools.dart
      path: packages/firebase_tools_common
dev_dependencies:
  test: ">=1.31.0"
resolution: workspace

