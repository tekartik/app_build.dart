name: tekartik_jaspr_build
description: >-
  Build, check and deploy jaspr static sites to Firebase Hosting: jaspr build
  with per target defines, post build fixes, firebase.json from the targets,
  i18n copies for Hosting language rewrites, link checks and a dev menu.
version: 0.1.2
publish_to: none

environment:
  sdk: ^3.12.0

# Never depends on jaspr: the site's own jaspr_cli is run through a shell, so
# this package adds no analyzer constraint to the workspace using it.
dependencies:
  path: ">=1.9.1"
  process_run: ">=1.4.0"
  dev_build: ">=1.1.15"
  tekartik_firebase_build:
    git:
      url: https://github.com/tekartik/app_build.dart
      path: packages/firebase_build

dev_dependencies:
  lints: ">=6.1.0"
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
  test: ">=1.31.0"
resolution: workspace
